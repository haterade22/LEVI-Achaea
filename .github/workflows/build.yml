name: Build & Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Validate Lua & Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax check all Lua files
        run: |
          echo "=== Checking Lua syntax ==="
          errors=0
          while IFS= read -r file; do
            if ! luac5.1 -p "$file" 2>/dev/null; then
              echo "SYNTAX ERROR: $file"
              luac5.1 -p "$file" || true
              errors=$((errors + 1))
            fi
          done < <(find src_new -name '*.lua' -type f)
          echo "=== Checked $(find src_new -name '*.lua' -type f | wc -l) files, $errors errors ==="
          if [ $errors -gt 0 ]; then exit 1; fi

      - name: Check for orphaned calls into disabled scripts
        run: python3 tools/check_orphans.py

      - name: Test the orphan checker
        run: python3 -B tools/test_check_orphans.py

      - name: Check trigger patterns fit on one wrapped line
        run: python3 tools/check_wrap.py

      - name: Check the clocks page and the scoreboard match the logs
        run: python3 -B tools/kb_timing.py --check

      - name: Test the log parser and the clocks
        run: python3 -B tools/test_kb_timing.py

      - name: Check the replay page matches the logs
        run: python3 -B tools/kb_replay.py --check

      - name: Test the replay of the deaths
        run: python3 -B tools/test_kb_replay.py

      # The import fails the build if lupa has no Lua 5.1. Without it, kb_sim.py --check exits 2 (NOT RUN).
      - name: Install lupa for the simulator
        run: |
          pip install lupa==2.8 --quiet
          python3 -c "import lupa.lua51"

      - name: Check the simulator page matches its inputs
        run: python3 -B tools/kb_sim.py --check

      - name: Test the simulator tool
        run: python3 -B tools/test_kb_sim.py

      - name: Check the whole-fight rules match their sources
        run: python3 -B tools/kb_rules.py --check

      - name: Test the whole-fight rules
        run: python3 -B tools/test_kb_rules.py

      - name: Check the Serpent census and race table match the logs
        run: python3 -B tools/kb_events.py --check

      - name: Test the census and the race table
        run: python3 -B tools/test_kb_events.py

      - name: Test the theorycraft CLI and the whole-fight engine
        run: python3 -B tools/test_theorycraft.py

      - name: Test the kbcapture importer (ABADMIN and artefact routes)
        run: python3 -B tools/test_kb_capture_import.py

      - name: Check the ABADMIN pages match kb/raw/ab
        run: python3 -B tools/kb_abadmin.py --check

      - name: Test the ABADMIN generator
        run: python3 -B tools/test_kb_abadmin.py

      - name: Check version consistency
        run: |
          echo "=== Checking version sync ==="
          V_TXT=$(cat version.txt | tr -d '[:space:]')
          V_MFILE=$(python3 -c "import json; print(json.load(open('muddler_project/mfile'))['version'])" | tr -d '[:space:]')
          V_YAML=$(grep -o 'ataxiaVersion = \\"[^\\]*' src_new/scripts/_groups.yaml | grep -o '[0-9][0-9.]*')

          echo "version.txt:    $V_TXT"
          echo "mfile:          $V_MFILE"
          echo "_groups.yaml:   $V_YAML"

          if [ "$V_TXT" != "$V_MFILE" ] || [ "$V_TXT" != "$V_YAML" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi
          echo "All 3 versions match: $V_TXT"

      - name: Run unit tests
        run: |
          echo "=== Running unit tests ==="
          lua5.1 src_new/tests/test_runner.lua

      - name: Validate YAML files
        run: |
          echo "=== Checking YAML files ==="
          pip install pyyaml --quiet
          python3 -c "
          import yaml, glob, sys
          errors = 0
          for f in glob.glob('src_new/**/_groups.yaml', recursive=True):
              try:
                  yaml.safe_load(open(f))
              except yaml.YAMLError as e:
                  print(f'YAML ERROR: {f}: {e}')
                  errors += 1
          print(f'Checked {len(glob.glob(\"src_new/**/_groups.yaml\", recursive=True))} YAML files, {errors} errors')
          sys.exit(1 if errors else 0)
          "

      # After the step above: the converter imports yaml.
      - name: Test the Muddler converter
        run: python3 -B tools/test_convert_to_muddler.py

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download Muddler
        # 2026-09-14: GitHub served a 504 page for this asset and a bare `curl -L -o` saved it as
        # the zip, so the v4.7.302 tag build failed twice on infrastructure with the code green.
        # --fail turns an HTTP error into a non-zero exit, --retry rides out a transient outage
        # (--retry-all-errors covers 5xx, which curl does not retry by default), and `unzip -tq`
        # proves it is an archive before anything depends on it.
        run: |
          curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors             -o muddler.zip https://github.com/demonnic/muddler/releases/download/1.1.0/muddle-shadow-1.1.0.zip
          unzip -tq muddler.zip
          unzip -q muddler.zip -d muddler-bin
          chmod +x muddler-bin/muddle-shadow-1.1.0/bin/muddle

      - name: Install Python dependencies
        run: pip install pyyaml --quiet

      - name: Convert source to Muddler format
        run: python tools/convert_to_muddler.py --src src_new --output muddler_project

      - name: Build with Muddler
        run: |
          cd muddler_project
          ../muddler-bin/muddle-shadow-1.1.0/bin/muddle

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Levi_Ataxia-${{ github.ref_name }}
          path: muddler_project/build/Levi_Ataxia.mpackage

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: muddler_project/build/Levi_Ataxia.mpackage
          generate_release_notes: true
