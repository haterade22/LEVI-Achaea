    - name: Self Limb Tracking
      script: "--Initialise the tables.\nselfLimbDamage = selfLimbDamage or {\n\t[\"head\"] = {damage = 0},\n\t[\"torso\"\
        ] = {damage = 0},\n\t[\"left arm\"] = {damage = 0},\n\t[\"right arm\"] = {damage = 0},\n\t[\"left leg\"] = {damage\
        \ = 0},\n\t[\"right leg\"] = {damage = 0},\n\t\n\ttimers = {},\n\tlasthit = \"none\",\t\n}\n\nfunction resetMissLines()\n\
        \tataxiaTables.missLines = {}\n\tataxiaTables.missLines = {\n\t\t\"You parry the attack with a deft manoeuvre.\",\
        \ \n\t\t\"The attack rebounds back onto %w+!\", \n\t\t\"The attack rebounds onto %w+!\", \n\t\t\"The attack rebounds\
        \ off your rebounding aura!\", \n\t\t\"%w+ misses you with \", \n\t\t\"You dodge nimbly out of the way.\", \n\t\t\"\
        One of your reflections has been destroyed! You have %d+ left.\", \n\t\t\"You twist your body out of harm's way.\"\
        , \n\t\t\"You quickly jump back, avoiding the attack.\", \n\t\t\"You frantically attempt to parry the attack of %w+,\
        \ but succeed only in redirecting it.\", \n\t\t\"You move inside %w+'s guard, deflecting %w+ attack to one side with\
        \ your forearm before countering with a swift blow to %w+ temple.\",\n\t}\nend\n\nfunction resetBladeMasterDamage()\n\
        \tataxiaTemp.blademasterDamage = {}\n\tlocal health = ataxia.vitals.maxhp\n\tlocal breakp = 0\n\tif health < 3600\
        \ then breakp = 7\n\telseif health < 4300 then breakp = 8\n\telseif health < 4900 then breakp = 9\n\telseif health\
        \ < 5500 then breakp = 10\n\telseif health < 6200 then breakp = 11\n\telseif health < 6900 then breakp = 12\n\telseif\
        \ health < 7600 then breakp = 13\n\telseif health < 8300 then breakp = 14\n\telse breakp = 15 end\n\t\n\tataxiaTemp.blademasterDamage.slash\
        \ = (210/breakp)\n\tataxiaTemp.blademasterDamage.off = (150/breakp)\n\tataxiaTemp.blademasterDamage.compass = (200/breakp)\n\
        end\n\nfunction resetKnightDamage()\n\tataxiaTemp.knightDamage = {}\n\tlocal health = ataxia.vitals.maxhp\n\t--snb\
        \ calculation first\n\tlocal brk = 7\n\tif health > 3800 then\n\t\thealth = health - 3800\n\t\twhile health > 0 do\n\
        \t\t\thealth = health - 450\n\t\t\tbrk = brk + 1\n\t\tend\n\tend\n\tataxiaTemp.knightDamage.snb = (100/brk)\n  local\
        \ dwc = ((ataxia.vitals.maxhp-3800)/500)+9\n  ataxiaTemp.knightDamage.dwc = (100/dwc)\nend"
      directory: levi_ataxia/levi/ataxia/self_limb_tracking
