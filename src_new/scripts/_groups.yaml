  - name: Combat
    script: "function calculateDictate(mana)\n\tlocal dicAff = {\"shadowmadness\", \"parasite\", \"retribution\", \"depression\"\
      }\n\tlocal c = 0\n\tlocal dictPos = 40\n\tfor _,aff in pairs(dicAff) do\n\t\tif haveAff(aff) then\n\t\t\tc = c + 1\n\
      \t\tend\n\tend\n\tif c > 0 then c = (c*5) end\n\tdictPos = dictPos + c\n\n\tif mana <= dictPos then\n\t\tcecho(\"<NavajoWhite>\
      \ [<blue>\"..mana..\"%<NavajoWhite>|<LightSkyBlue>\"..dictPos..\"%<NavajoWhite>]\")\n\t\tataxia_boxEcho(string.upper(target)..\"\
      \ CAN BE DICTATED\", \"black:DodgerBlue\")\n\telse\n\t\tcecho(\"<NavajoWhite> [<blue>\"..mana..\"%<NavajoWhite>|<LightSkyBlue>\"\
      ..dictPos..\"%<NavajoWhite>]\")\n\tend\nend\n\nfunction depressionCount()\n\tlocal depAff = {\"depression\", \"nausea\"\
      , \"hypochondria\"}\n\tlocal c = 0\n\tfor _, aff in pairs(depAff) do\n\t\tif haveAff(aff) then\n\t\t\tc = c + 1\n\t\t\
      end\n\tend\n\treturn c\nend\n\nfunction targetAffCount()\n\tlocal ignore = {\"curseward\", \"prone\", \"blindness\"\
      , \"deafness\", \"rebounding\", \"shield\", \"hierophant\", \"worms\"}\n\tlocal c = 0\n\tfor i,v in pairs(tAffs) do\n\
      \t\tif not table.contains(ignore, i) then\n\t\t\tif v == true then\n\t\t\t\tc = c + 1\n\t\t\tend\n\t\tend\n\tend\n\t\
      return c\nend"
    children:
    - name: Offensive Things
      script: "function getLockingAffliction(type)\n\tlocal lockaff = {\n\t\tAlchemist = {\"stupidity\", \"stupid\"},\n\t\t\
        Apostate = {\"voyria\", \"plague\"},\n    Pariah = {\"voyria\", \"plague\"},\n\t\tBard = {\"voyria\", \"plague\"},\n\
        \t\tBlademaster = {\"weariness\", \"weariness\"},\n\t\tDepthswalker = {\"recklessness\", \"reckless\"},\n\t\tDruid\
        \ = {\"weariness\", \"weariness\"},\n\t\tInfernal = {\"weariness\", \"weariness\"},\n\t\tJester = {\"paralysis\",\
        \ \"paralyse\"},\n\t\tMagi = {\"haemophilia\", \"haemophilia\"},\n\t\tMonk = {\"weariness\", \"weariness\"},\n\t\t\
        Occultist = {\"paralysis\", \"paralyse\"},\n\t\tPaladin = {\"weariness\", \"weariness\"},\n    Unnamable = {\"weariness\"\
        , \"weariness\"},\n\t\tPriest = {\"voyria\", \"plague\"},\n\t\tPsion = {\"confusion\", \"confusion\"},\n\t\tRunewarden\
        \ = {\"weariness\", \"weariness\"},\n\t\tSentinel = {\"weariness\", \"weariness\"},\n\t\tSerpent = {\"weariness\"\
        , \"weariness\"},\n\t\tShaman = {\"paralysis\", \"paralyse\"},\n\t\tSylvan = {\"haemophilia\", \"haemophilia\"},\n\
        \    Airlord = {\"weariness\", \"weariness\"},\n    Waterlord = {\"weariness\", \"weariness\"},\n    Earthlord = {\"\
        weariness\", \"weariness\"},\n    Firelord = {\"weariness\", \"weariness\"},\n\t}\n\tif ataxiaNDB and ataxiaNDB_Exists(target)\
        \ and ataxiaNDB.players[target] and ataxiaNDB.players[target].city ~= \"Underworld\" then\n\t\tlocal gClass = ataxiaNDB_getClass(target)\n\t\tif\
        \ not gClass or not lockaff[gClass] then return nil end\n\t\tif\
        \ type == \"name\" then\n\t\t\treturn lockaff[gClass][1]\n\t\telse\n\t\t\treturn lockaff[gClass][2]\n\t\tend\n\telse\n\
        \t\tif ataxiaNDB and ataxiaNDB.players and ataxiaNDB.players[target] and type == \"name\" and ataxiaNDB.players[target].city == \"Underworld\" then\n\t\t\treturn \"paralysis\"\n\t\t\
        else\n\t\t\treturn \"paralyse\"\n\t\tend\n\tend\nend"
      children:
      - name: Monk
        script: "function monk_checkCombo(str)\n  local sp = ataxia.settings.separator or \"::\"\n  local aSplit = string.split(str,\
          \ sp)\n  local shik, tekStr = true, \"\"\n  local comboList = false\n  for _, com in pairs(aSplit) do\n    if com:find(\"\
          combo\") then\n      comboList = string.split(com)\n      break\n    end\n  end\n  \n  if comboList then\n    ataxiaTemp.shikCombo\
          \ = {}\n    local kicks = {\"flashheel\", \"risingkick\", \"frontkick\", \"spinkick\", \"crescent\"}\n    local\
          \ staff = {\"shatter\", \"thrust\", \"dart\", \"hiraku\", \"hiru\", \"ruku\", \"kuro\", \"livestrike\", \"nervestrike\"\
          , \"needle\", \"jinzuku\"}\n    local tek = {\"hrs\", \"hkp\", \"snk\", \"jbp\", \"sdk\", \"ucp\", \"pmp\", \"hfp\"\
          , \"cts\", \"rhk\", \"swk\", \"brs\",\n      \"slt\", \"mnk\", \"spp\", \"rts\", \"thk\", \"wrt\", \"axk\", \"scs\"\
          , \"wwk\", \"blp\", \"bbt\", \"jpk\", \"drs\"}\n    local hit = \"\"\n    \n    for num, act in pairs(comboList)\
          \ do\n      if table.contains(kicks, act) then\n        ataxiaTemp.shikCombo.kick = act\n      elseif table.contains(staff,\
          \ act) then\n        if comboList[num+1] == \"light\" then\n          hit = act..\" light\"\n        else\n    \
          \      hit = act\n        end\n        if ataxiaTemp.shikCombo.attackone then\n          ataxiaTemp.shikCombo.attacktwo\
          \ = hit\n        else\n          ataxiaTemp.shikCombo.attackone = hit\n        end\n      elseif table.contains(tek,\
          \ act) then\n        tekStr = tekStr..\" <green>(<NavajoWhite>\"..act\n        if comboList[num+1] == \"left\" or\
          \ comboList[num+1] == \"right\" then\n          tekStr = tekStr..\" \"..comboList[num+1]\n        end\n        tekStr\
          \ = tekStr..\"<green>)\"\n      end\n    end\n    if table.contains(comboList, \"sweep\") then\n      ataxiaTemp.shikCombo.attackone\
          \ = \"sweep\"; ataxiaTemp.shikCombo.attacktwo = \"sweep\"\n    end\n    if not ataxiaBasher.enabled then\n     \
          \ cecho(\"\\n<a_darkblue>[<DimGrey>\"..comboList[2]:upper()..\"<a_darkblue>]: \")\n      if tekStr == \"\" then\n\
          \        cecho(\"<DimGrey>\"..(ataxiaTemp.shikCombo.kick and ataxiaTemp.shikCombo.kick..\" - \" or \"\"))\n    \
          \    cecho(\"<DimGrey>\"..(ataxiaTemp.shikCombo.attackone and ataxiaTemp.shikCombo.attackone..\" - \" or \"\"))\n\
          \        cecho(\"<DimGrey>\"..(ataxiaTemp.shikCombo.attacktwo and ataxiaTemp.shikCombo.attacktwo..\".\" or \".\"\
          ))\n      else\n        cecho(\"<DimGrey>\"..tekStr..\".\")\n      end\n    end\n  end\nend"
        directory: levi_ataxia/levi/ataxia/monk
      - name: Limb Management
        script: "function target_limbBroke(limb)\n\tlocal brk = \"damaged\"..string.gsub(limb,\
          \ \" \", \"\")\n\ttAffs[brk] = true\nend\n\nfunction targetLimbs_updateTimers(limbhit)\n\
          end\n\nfunction target_resetLimb(limbhit)\n\tif lb and lb.resetLimb then\
          \ lb.resetLimb(target, limbhit) end\nend\n\nfunction limbCounter_textTag()\n\
