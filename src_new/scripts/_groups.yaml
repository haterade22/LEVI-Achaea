    children:
    - name: Deffing
      script: "function buildDefsTable()\n\tataxiaTables.defences = {}\n\n\tataxiaTables.defences = {\n\t\t--Curatives\n\t\
        \tairpocket = \"airpocket\",\n\t\tblindness = \"blindness\",\n\t\tcaloric = \"insulation\",\n\t\tdeafness = \"deafness\"\
        ,\n\t\tdeathsight = \"deathsight\",\n\t\tfangbarrier = \"fangbarrier\",\n\t\tfrost = \"temperance\",\n\t\tinsomnia\
        \ = \"insomnia\",\n\t\tkola = \"kola\",\n\t\tlevitation = \"levitating\",\n\t\tmass = \"density\",\n\t\tparrying =\
        \ \"parrying\",\n\t\trebounding = \"rebounding\",\n\t\tspeed = \"speed\",\n\t\tshield = \"shield\",\n\t\tthirdeye\
        \ = \"thirdeye\",\n\t\tvenom = \"poisonresist\",\n\n\t\t--Alchemist\n\t\tastronomy = \"astronomy\",\n    compoundmask\
        \ = \"compoundmask\",\n\t\tmercury = \"mercury\",\n\t\tsulphur = \"sulphur\",\n\t\ttin = \"tin\",\n\n\t\t--Blademaster\n\
        \t\tconsciousness = \"consciousness\",\n\t\tshinclarity = \"shinclarity\",\n\t\tshinbinding = \"shinbinding\",\n\t\
        \tshintrance = \"shintrance\",\n\t\tretaliation = \"retaliation\",\n    mindnet = \"mindnet\",\n    weathering = \"\
        weathering\",\n\n\n\t\t--Apostate\n\t\tdemonarmour = \"demonarmour\",\n\t\ttruestare = \"truestare\",\n\t\t\n\t\t\
        --Bard\n\t\taria = \"aria\",\n\t\tlay = \"lay\",\n\t\tsongbird = \"songbird\",\n\t\ttune = \"blade tune\",\n\t\theartsfury\
        \ = \"heartsfury\",\n    acrobatics = \"acrobatics on\",\n    harrying = \"dance harrying\",\n\n\t\t--Depthswalker\n\
        \t\tblur = \"blur\",\n\t\tbodyaugment = \"bodyaugment\",\n\t\tdisperse = \"disperse\",\n\t\tdurability = \"durability\"\
        ,\n\t\tprecision = \"precision\",\n\t\tshadowveil = \"shadowveil\",\n    antiforce = \"antiforce\",\n\t\t\n\t\t--Dragon/Elemental\
        \ Lord\n\t\tcohesion = \"cohesion\",\n\t\tdragonbreath = \"dragonbreath\",\n\t\tdragonarmour = \"dragonarmour\",\n\
        \t\ttempest = \"tempest\",\n\t\tsusurrating = \"susurrating\",\n    fireshroud = \"fireshroud\",\n    extrusion =\
        \ \"extrusion\",\n    strata = \"strata\",\n\t\t\n\t\t--Jester\n\t\tslippery = \"slippery\",\n\t\tbalancing = \"balancing\"\
        ,\n\t\tacrobatics = \"acrobatics\",\n    \n    -- Knight\n    deflect = \"deflect\",\n    blademastery = \"blademastery\"\
        ,\n\t\t\n    --Magi\n\t\tchargeshield = \"chargeshield\",\n\t\tdiamondskin = \"diamondskin\",\n\t\tstoneskin = \"\
        stoneskin\",\n    simultaneity = \"simultaneity\",\n\n\t\t--Monk\n\t\tboostedregeneration = \"boosting\",\n\t\tkaitrance\
        \ = \"kaitrance\",\n\t\thyperfocus = \"hyperfocus\",\n\t\tregeneration = \"regeneration\",\n\t\tshikudoform = \"shikudoform\"\
        ,\n\t\tsplitmind = \"splitmind\",\n\t\tmindnet = \"mindnet\",\n    bodyblock = \"bodyblock\",\n    evadeblock = \"\
        evadeblock\",\n    pinchblock = \"pinchblock\",\n    hypersense = \"hypersense\",\n    kaiboost = \"kaiboost\",\n\
        \    mindcloak = \"mindcloak\", \n    \n    --pariah\n    shieldlogograph = \"shieldlogograph\",\n    accursedresolve\
        \ = \"accursedresolve\",\n    leechlogograph = \"leechlogograph\",       \n\n\t\t--Necromancy\n\t\tdeathaura = \"\
        deathaura\",\n\t\tlifevision = \"lifevision\",\n\t\tsoulcage = \"soulcage\",\n\t\tvengeance = \"vengeance\",\n\n\t\
        \t--Occultist\n\t\tarctar = \"arctar\",\n\t\tdevilmark = \"devilmark\",\n\t\tdistortedaura = \"distortedaura\",\n\t\
        \ttentacles = \"tentacles\",\n\n\t\t--Priest\n\t\twillpowerblessing = \"willpowerblessing\",\n\t\tenduranceblessing\
        \ = \"enduranceblessing\",\n\t\tthermalshield = \"thermalshield\",\n\t\tfrostshield = \"frostshield\",\n\t\tearthshield\
        \ = \"earthshield\",\n\n\t\t--Psion\n\t\tguidedstrike = \"guidedstrike\",\n\t\tpsitranscend = \"psitranscend\",\n\t\
        \tsecondskin = \"secondskin\",\n\t\trupturesight = \"rupturesight\",\n    psicomprehend = \"psicomprehend\",\n   \
        \ psibreakthrough = \"psibreakthrough\",
    indomitability = \"indomitability\",
    clarity = \"clarity\",\n\n\t\t--Sentinel\n\t\taffinity = \"affinity\",\n\t\tbarkskin = \"barkskin\"\
        ,\n\t\tfirstaid = \"firstaid\",\n\t\tstealth = \"stealth\",\n    scouting = \"scouting\",\n    fleetness = \"fleetness\"\
        ,\n    \n\n\t\t--Serpent\n     ghost = \"ghost\",\n     lipreading = \"lipreading\",\n     pacing = \"pacing\",\n\
        \     scales = \"scales\",\n     weaving = \"weaving\",\n     secondsight = \"secondsight\",\n     hide = \"hiding\"\
        ,\n\n\t\t--Shaman\n\t\tswiftcurse = \"swiftcurse\",\n    \n    --Sylvan\n    spinningstaff = \"spinningstaff\",\n\
        \    viridian = \"viridian\",\n    \n    --Unnamable\n    bulk = \"bulk\",\n    mouths = \"mouths\",\n    joints =\
        \ \"joints\",\n    eyes = \"eyes\",\n    unnamablepresence = \"unnamablepresence\",\n\n\t\t--Shared\n    avoid = \"\
        avoid \" .. (ataxia.settings.avoidType or \"physical\"),\n    grookbubble = \"grookbubble\",\n\t\tconstitution = \"\
        constitution\",\n    consciousness = \"consciousness\",\n\t\tcurseward = \"curseward\",\n\t\tgripping = \"gripping\"\
        ,\n\t\tlifevision = \"lifevision\",\n\t\tnicatorlegend = \"nicatorlegend\",\n\t\tnightsight = \"nightsight\",\n\t\t\
        resistance = \"resistance\",\n\t\ttoughness = \"toughness\",\n    shroud = \"shroud\",\n\t\tweathering = \"weathering\"\
        ,\n\t\tvitality = \"vitality\",\n\t\tblocking = \"blocking\",\n\t\tcoldresist = \"coldresist\",\n\t\telectricresist\
        \ = \"electricresist\",\n\t\tfireresist = \"fireresist\",\n\t\tmagicresist = \"magicresist\",\n\t\thypersight = \"\
        hypersight\",\n\t\talertness = \"alertness\",\n\t\tvigilance = \"vigilance\",\n\t\tskywatch = \"skywatch\",\n\t\t\
        treewatch = \"treewatch\",\n\t\tgroundwatch = \"groundwatch\",\n    selfishness = \"selfishness\",\n    heldbreath\
        \ = \"heldbreath\",\n\n\t\t--Tattoos\n\t\tboartattoo = \"boartattoo\",\n\t\tcloak = \"cloak\",\n\t\tmegalithtattoo\
        \ = \"megalithtattoo\",\n\t\tmindseye = \"mindseye\",\n\t\tmoontattoo = \"moontattoo\",\n\t\tmosstattoo = \"mosstattoo\"\
        ,\n\n\t}\nend\n\nfunction find_defence(d)\n\tlocal def = d\n\tbuildDefsTable()\n\n\n\n\tfor defence, actual in pairs(ataxiaTables.defences)\
        \ do\n\t\tif defence == def or actual == def then\n\t\t\treturn defence\n\t\tend\n\tend\nend\n\nfunction trueDef(def)\n\
        \tlocal def = def:lower()\n\tbuildDefsTable()\n\n\tif def:find(\"parrying\") then\n\t\treturn \"parrying\"\n\telse\n\
        \t\tfor defence, actual in pairs(ataxiaTables.defences) do\n\t\t\tif defence == def or actual == def then\n\t\t\t\t\
        return defence\n\t\t\tend\n\t\tend\n\tend\n  return def\nend"
      directory: levi_ataxia/levi/ataxia/deffing
