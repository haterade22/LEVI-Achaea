    - name: Bashing
      script: "ataxiaBasher = ataxiaBasher or {}\nataxiaBasher.functions = ataxiaBasher.functions or {}\n\nfunction get_Battlerage()\n\
        \tataxiaBasher.battlerage = {\n\t\tAlchemist = {\n\t\t\tsmall = \"throw miasma at \"..target, large = \"educe magnesium\
        \ \"..target,\n\t\t\traze = \"throw caustic at \"..target,\n\t\t},\n\t\t\n\t\tApostate = {\n\t\t\tsmall = \"stare\
        \ \"..target..\" convulsions\", large = \"daegger burrow \"..target,\n\t\t\traze = \"daegger pierce \"..target,specialuse\
        \ = \"bloodlet \" ..target, \n      specialafflict = \"possess \" ..target, special = \"possess \" ..target\n    \
        \  --Convulsions - Small Rage - 14 Rage | 16 Cooldown\n      -- Pierce - 17 rage\n      --Horrify - Gives Fear - 29\
        \ Rage | 34 CD\n      -- Dagger burrow - Large Rage - 36 Rage | 24 CD\n      --Bloodlet - Uses Sensitivity or Stun\
        \ - 25 Rage | 23 Cooldown\n      --Possess - Gives Charm - 32 Rage | 43 CD\n      \n\t\t},\t\n\t\t\n\t\tBard = {\n\
        \t\t\tsmall = \"moulinet \"..target,\tlarge = \"howlslash \"..target,\n      special2 = \"play charm at \"..target,\
        \ special = \"play trill at \"..target\n\t\t},\n\n\t\tBlademaster = {\n\t\t\tsmall = \"leapstrike \"..target, large\
        \ = \"spinslash \"..target,\n\t\t\traze = \"shin shatter \"..target, special = \"shin daze \"..target,\n      specialuse\
        \ = \"strike \"..target..\" head\", specialafflict = \"nsl \" ..target,\n      --Headstrike (Strike Target Head) -\
        \ Uses Recklessness or Fear\n      --Nerveslash - NSL Target - gives Weakness\n\t\t},\n\n\t\t[\"Black Dragon\"] =\
        \ {\n\t\t\tsmall = \"dragonspit \"..target,\n\t\t\tlarge = \"override \"..target,\n\t\t\traze = \"dissolve \"..target,\n\
        \      special = \"dragonfear \" ..target,\n\t\t},\n\t\t\n\t\t[\"Blue Dragon\"] = {\n\t\t\tsmall = \"dragonchill \"\
        ..target,\n\t\t\tlarge = \"override \"..target,\n\t\t\traze = \"frostrive \"..target,\n      special = \"ague \"..target,\n\
        \t\t},\n\t\t\n\t\tDepthswalker = {\n\t\t\tsmall = \"shadow drain \"..target, large = \"shadow lash \"..target,\n\t\
        \t\traze = \"intone nakail \"..target,\n\t\t},\n    \n    Infernal = {\n      small = \"ravage \"..target, large =\
        \ \"spike \"..target,\n      raze = \"shiver \"..target, special = \"soulshield\",\n    },\n\t\t\n\t\tJester = {\n\
        \t\t\tsmall = \"noogie \"..target, large = \"ensconce firecracker on \"..target,\n\t\t\traze = \"throw jacks at \"\
        ..target,\n\t\t},\n\t\t\n\t\tMagi = {\n\t\t\tsmall = \"cast windlash at \"..target, large = \"cast squeeze \"..target,\n\
        \      special = \"cast dilation at \"..target,\n      specialafflict = \"cast stormbolt at \"..target, specialuse = \"cast firefall at \"..target,\n      raze = \"cast disintegrate at \"..target,\n      --Kit: Windlash(small,14) Dilation(special,35=aeon) Disintegrate(raze,17=DENIZEN shield)\n      --  Squeeze(large,36) Firefall(specialuse,25=bonus vs clumsy/reckless) Stormbolt(specialafflict,25=sensitivity).\n      --raze(disintegrate) is NOT fired -- magiBashing casts the free erode; see ataxiaBasher_magiBattlerage.\n      --Cast syntax for stormbolt/firefall/disintegrate assumed \"cast X at\" -- confirm in-game.\n\t\t},\n\t\t\n\t\tMonk = { \n\t\t\tsmall = \"sbp \"..target,\t\t\t\
        \tlarge = \"tnk \"..target,\n      raze = \"spk \"..target, special = \"mind scramble \" ..target,\n      specialafflict = \"rpst \"..target, specialuse = \"mind blast \"..target,\n      --Spinningbackfist (SBP) - Small - 14 Rage | 16s CD\n      --Splinterkick (SPK) - Shield break - 17 Rage | NOT used: Monk breaks shields with\n      --  the FREE shatter (Shikudo, works in any form) / rhk (Tekura). See monkBashing2.\n      --Scramble (MIND SCRAMBLE) - Gives Clumsiness - 22 Rage | 31s CD\n      --Mindblast (MIND BLAST) - Uses Weakness or Sensitivity - 25 Rage | 23s CD\n      --Ripplestrike (RPST) - Gives Inhibit (stops denizen healing) - 25 Rage | 27s CD\n      --NOTE: specialafflict/specialuse are INERT until a Monk-specific rotation reads\n      --  them - ataxiaBasher_standardBattlerage only fires small/large/special.\n\t\t},\n\t\tOccultist\
        \ = {\n\t\t\tsmall = \"harry \"..target,\t\t\tlarge = \"chaosgate \"..target\n\t\t},\n    \n    Pariah = {\n     \
        \ small = \"blood boil \"..target,  large = \"swarm feast \"..target,\n      raze = \"accursed scour \"..target, specialuse\
        \ = \"trace spider \"..target,\n      specialafflict = \"accursed wail \"..target, special = \"accursed wail \"..target,\n\
        \      --Trace Spider - Sensitive or Inhitbited\n      --Accursed Wail - Gives Clumsiness\n    },\n    \n    Paladin\
        \ = {\n      small = \"harrow \"..target,\n      large = \"perform rite of shock at \"..target,\n      raze = \"faithrend\
        \ \"..target,\n    },\n\t\t\n\t\tPriest = {\n\t\t\tsmall = \"angel torment \"..target,\n\t\t\tlarge = \"perform rite\
        \ of desolation on \"..target,\n\t\t\traze = \"crack \"..target,\n\t\t},\n\t\t\n\t\tPsion = {\n\t\t\tsmall = \"weave\
        \ barbedblade \"..target,\n\t\t\tlarge = \"weave whirlwind \"..target,\n      special = \"enact regrowth \"..target,\n\
        \      raze = \"weave pulverise \"..target,\n\t\t},\n\t\t\n\t\tRunewarden = {\n\t\t\tsmall = \"collide \"..target,\t\
        \tlarge = \"onslaught \"..target,\n\t\t\traze = \"fragment \"..target, special = \"bulwark\",\n\t\t},\n\n\t\tSentinel\
        \ = {\n\t\t\tsmall = \"pester \"..target, \n\t\t\tlarge = \"skewer \"..target,\n\t\t},\n\n\t\tSerpent = {\n\t\t\t\
        small = \"thrash \"..target,\n\t\t\tlarge = \"throatrip \"..target,\n\t\t\traze = \"excoriate \"..target,\n      special\
        \ = \"obliviate \"..target,\t\t\n\t\t},\n\t\t\n\t\tShaman = {\n\t\t\tsmall = \"curse \"..target..\" corruption\",\n\
        \t\t\tlarge = \"curse \"..target..\" haemorrhage\",\n\t\t\traze = \"curse \"..target..\" vulnerability\",\n      special\
        \ = \"invoke korkma \"..target,\n      special2 = \"invoke cesaret \"..target,\n\t\t},\n\t\t\n\t\tSylvan = {\n\t\t\
        \tsmall = \"cast torrent at \"..target,\n\t\t\tlarge = \"stonevine \"..target,\n\t\t},\n    \n    Unnamable = {\n\
        \      small = \"unnamable shriek \"..target,\n      large = \"unnamable destroy \"..target,\n      raze = \"unnamable\
        \ sunder \"..target,\n    },\n\t\t\n\t\t[\"Silver Dragon\"] = {\n\t\t\tsmall = \"overwhelm \"..target,\n\t\t\tlarge\
        \ = \"dragonspark \"..target,\n\t\t\traze = \"splinter \"..target,\n\t\t},\n\t\t\n\t\t[\"Water Elemental\"] = {\n\t\
        \t\tsmall = \"manifest icicles \"..target,\n\t\t\tlarge = \"manifest needlerain \"..target,\n\t\t},\n    \n\t\t[\"\
        Air Elemental\"] = {\n\t\t\tsmall = \"manifest bolt \"..target, \n\t\t\tlarge = \"manifest pressurewave \"..target\n\
        \t\t},\n    \n    [\"Fire Elemental\"] = {\n      small = \"manifest engulf \"..target,\n      large = \"manifest\
        \ devastation \"..target,\n      raze = \"manifest wires \"..target,\n    },\n    \n    [\"Earth Elemental\"] = {\n\
        \      small = \"terran smash \"..target,\n      large = \"terran flurry \"..target,\n      raze = \"terran charge\
        \ \"..target,\n    },\n    \n    [\"Green Dragon\"] = {\n      small = \"dragonspit \"..target,\n      large = \"\
        override \"..target,\n      raze = \"deteriorate \"..target,\n    }, \n    \n    [\"Red Dragon\"] = {\n      small\
        \ = \"overwhelm \"..target,\n      large = \"dragonblaze \"..target,\n      raze = \"melt \"..target,\n    },\n  \
        \  \n    [\"Golden Dragon\"] = {\n      small = \"overwhelm \"..target,\n      large = \"psiblast \"..target,\n  \
        \    raze = \"psishatter \"..target,\n    },   \n\t}\nend\n\nfunction ataxiaBasher_elevatemob(mob)\n\tlocal area =\
        \ ataxiaBasher_areaKey()\n\ttable.remove(ataxiaBasher.targetList[area], table.index_of(ataxiaBasher.targetList[area],\
        \ mob))\n\ttable.insert(ataxiaBasher.targetList[area], 1, mob)\n\tataxiaEcho(\"Elevated priority of \"..mob..\".\"\
        )\n\tataxia_saveSettings(false)\nend\n\nfunction ataxiaBasher_addmob(mob)\n\tlocal area = ataxiaBasher_areaKey()\n\t\
        if not table.contains(ataxiaBasher.targetList[area], mob) then\n\t\ttable.insert(ataxiaBasher.targetList[area], mob)\n\
        \t\tataxiaEcho(\"Added \"..mob..\" to \"..(area ~= \"\" and area or \"the Mnemosyne\")..\"'s target list.\")\n\telse\n\t\tataxiaEcho(\"That mob is already\
        \ on the list.\")\n\tend\n\tataxia_saveSettings(false)\nend\n\nfunction ataxiaBasher_remmob(mob)\n\tlocal area = ataxiaBasher_areaKey()\n\
        \tif table.contains(ataxiaBasher.targetList[area], mob) then\n\t\tfor i,v in pairs(ataxiaBasher.targetList[area])\
        \ do\n\t\t\tif v == mob then\n\t\t\t\ttable.remove(ataxiaBasher.targetList[area], i)\n\t\t\t\tbreak\n\t\t\tend\n\t\
        \tend\n\t\tataxiaEcho(\"Removed \"..mob..\" from \"..(area ~= \"\" and area or \"the Mnemosyne\")..\"'s target list.\")\n\telse\n\t\tataxiaEcho(\"That mob\
        \ is not on the list.\")\n\tend\n\tataxia_saveSettings(false)\nend\n\nfunction ataxiaBasher_ignoremob(mob)\n\tif not\
        \ table.contains(ataxiaBasher.mobIgnore, mob) then\n\t\ttable.insert(ataxiaBasher.mobIgnore, mob)\n\t\tataxiaEcho(\"\
        Added \"..mob..\" to ignore list.\")\n\telse\n\t\tataxiaEcho(\"That mob is already on the list.\")\n\tend\n\tataxia_saveSettings(false)\n\
        end\n\nfunction ataxiaBasher_unignoremob(mob)\n\tif table.contains(ataxiaBasher.mobIgnore, mob) then\n\t\tfor i,v\
        \ in pairs(ataxiaBasher.mobIgnore) do\n\t\t\tif v == mob then\n\t\t\t\ttable.remove(ataxiaBasher.mobIgnore, i)\n\t\
        \t\t\tbreak\n\t\t\tend\n\t\tend\n\t\tataxiaEcho(\"Removed \"..mob..\" from the ignore list.\")\n\telse\n\t\tataxiaEcho(\"\
        That mob is not on the list.\")\n\tend\n\tataxia_saveSettings(false)\nend\n\nfunction ataxiaBasher_dangerAdd(mob)\n\
        \tataxiaBasher.dangerList = ataxiaBasher.dangerList or {}\n\tif ataxiaBasher.dangerList[mob] then\n\t\tataxiaEcho(mob:title()..\"\
        \ is already in the danger list.\")\n\telse\n\t\tataxiaBasher.dangerList[mob] = true\n\t\tataxiaEcho(\"Added \"..mob..\"\
        \ to the danger list.\")\n\tend\nend\n\nfunction ataxiaBasher_dangerRemove(mob)\n\tataxiaBasher.dangerList = ataxiaBasher.dangerList\
        \ or {}\n\tif ataxiaBasher.dangerList[mob] then\n\t\tataxiaBasher.dangerList[mob] = nil\n\t\tataxiaEcho(\"Removed\
        \ \"..mob..\" from the danger list.\")\n\telse\n\t\tataxiaEcho(mob:title()..\" was not considered dangerous anyway.\"\
        )\n\tend\nend\n\nfunction ataxiaBasher_shieldingRemove(mob)\n\tataxiaBasher.noShieldBreak = ataxiaBasher.noShieldBreak\
        \ or {mobs = {}, threshold = 0}\n\tif ataxiaBasher.noShieldBreak.mobs[mob] then\n\t\tataxiaBasher.noShieldBreak.mobs[mob]\
        \ = nil\n\t\tataxiaEcho(\"Removed \"..mob..\" from the shield-safety list.\")\n\telse\n\t\tataxiaEcho(mob:title()..\"\
        \ was already recognised as being able to break shields.\")\n\tend\nend\n\nfunction ataxiaBasher_shieldingAdd(mob)\n\
        \tataxiaBasher.noShieldBreak = ataxiaBasher.noShieldBreak or {mobs = {}, threshold = 0}\n\tif ataxiaBasher.noShieldBreak.mobs[mob]\
        \ then\n\t\tataxiaEcho(mob:title()..\" is already in the shielding list.\")\n\telse\n\t\tataxiaBasher.noShieldBreak.mobs[mob]\
        \ = true\n\t\tataxiaEcho(\"Added \"..mob..\" to the shielding list.\")\n\tend\nend\n\nfunction ataxiaBasher_alert(alerttype)\n\
        \tif ataxiaTemp.playedAlarm then return end\n\tlocal alarm = alerttype:title()\n\tif not hasFocus() then \n\t\tplaySoundFile(getMudletHomeDir()..[[/Alerts/]]..alarm..[[.mp3]])\
        \ \n\tend\n\t\n\tataxiaTemp.playedAlarm = tempTimer(3, [[ ataxiaTemp.playedAlarm = nil ]])\nend"
