        , \"clumsiness\", \"sensitivity\"},\n\tash = {\"confusion\", \"hypersomnia\", \"hallucinations\", \"paranoia\", \"\
        dementia\",\"crescendo\",},\n\tginseng = {\"flushings\", \"lethargy\", \"haemophilia\", \"addiction\", \"nausea\"\
        , \"scytherus\", \"darkshade\", \"unweavingbody\"},\n}\n\nfunction haveSmokeAff()\n\tlocal smoke = false\n\tlocal\
        \ sAffs = {\"deadening\", \"tension\",\n\t\t\"disloyalty\", \"hellsight\", \"manaleech\", \"slickness\", \"unweavingspirit\"\
        ,\"earworm\",}\n    \n\tfor i=1, #sAffs do\n\t\tif haveAff(sAffs[i]) then\n\t\t\tsmoke = true\n\t\t\tbreak\n\t\tend\n\
        \tend\n\t\n\treturn smoke\nend\n\nfunction hasSalveAff()\n  local salve = false\n  local sAffs = {\"frozen\", \"shivering\"\
        , \"anorexia\", \"burns\", \"ablaze\", \"selarnia\",\n    \"damagedleftleg\", \"damagedrightleg\", \"mangledleftleg\"\
        , \"mangledrightleg\",\n    \"damagedleftarm\", \"damagedrightarm\", \"mangledleftarm\", \"mangledrightarm\",\n  \
        \  \"brokenleftarm\", \"brokenrightarm\", \"brokenleftleg\", \"brokenrightleg\", \"hypothermia\"}\n    \n  for i=1,\
        \ #sAffs do\n    if haveAff(sAffs[i]) then\n      salve = true\n      break\n    end\n  end\n  \n  return salve\n\
        end\n\nfunction restorePassiveCure()\n  cecho(\"\\n<green>+ \"..passiveFailsafe..\" +\")\n  tAffs[passiveFailsafe]\
        \ = true\n  passiveFailsafe = nil\nend\n\n"
