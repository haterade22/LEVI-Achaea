      - name: Toggles
      - name: Prompt
        script: "--ACONFIG CUSTOMPROMPT <text> will set what you want your custom prompt to look like, following the guidelines\
          \ below. \n--This setting is saved in the ataxia.settings.customprompt variable. You can see the current prompt string\
          \ by doing ACONFIG CUSTOMPROMPT SHOW\n--An example aconfig customprompt @health @mana @willpower @endurance would show\
          \ you 6007 5339 25470 22200 or something similar. \n--For the most part, you can freely add text to the end of these\
          \ tags, so @healthh would change that 6007 to a 6007h. @percenthealth would show \n--100 if at full health, @percenthealth%h\
          \ would show 100%h. ]]--\n\n-- Prompt Tags:\n--@health: Your current health.\n--@percenthealth: Your current health\
          \ in percent form.\n--@mana: Your current mana.\n--@percentmana: Your current mana in percent form.\n--@endurance:\
          \ Your current endurance.\n--@percentendurance: Your current endurance in percent form.\n--@willpower: Your current\
          \ willpower.\n--@precentwillpower: Your current willpower in percent form.\n--@bleeding: Will display a number if your\
          \ bleeding is greater than 100.\n--@bal: Will show a simple x if you have balance.\n--@eq: Will show a simple e if\
          \ you have equilibrium.\n--@targetinfo: Will display what 'target' is currently set to, as well as its health if it's\
          \ a mob.\n--@paused: Shows (pp) if system is paused.\n--@metawake: Shows \"Mw\" if metawake is up.\n--@exp: Shows\
          \ current % experience into the next level.\n--@timestamp: Displays a timestamp of current time.\n--@defs: Shows which\
          \ defencess are active. b (blindness), d (deafness), c (Cloak), k (kola), m (mass)\n--@affs: Shows what affs are affecting\
          \ you.\n\n--@tlimbs: shows limbs on prompt, when any limb gets damaged. Text format. RL.LL etc.\n--@nlimbs: same as\
          \ above, but number format. Order is lleg, rleg, larm, rarm, torso, head.\n-- EG: {99.91|58.2|69.23...} etc.\n\n--\
          \ Prompt Color Tags:\n--#hcolour : Colours something  green if over 75% health, yellow if over 50% health, orange if\
          \ over 25 and otherwise red if below 25% health.\n--#mcolour: Colours something green if over 75% mana, yellow if over\
          \ 50% mana, orange if over 25% mana and otherwise red if below 25% mana\n--#wcolour / #mcolour : same as hcolour.\n\
          --#(colour) : any color you can find in mudlet. \n\n"
