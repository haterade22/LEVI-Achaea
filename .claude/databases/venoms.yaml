# Achaea Venoms Database
# For Claude AI consumption - structured data for combat system development
# REGENERATED 2026-10-11 from authoritative sources, replacing a hand-written list that had 12
# wrong venom -> affliction mappings (euphorbia was 'impatience', xentio 'stupidity', notechis
# 'shyness', ...). Code was written from it: the Infernal group lock still sends euphorbia for
# impatience. Sources, per field:
#   affliction  -- venom_to_aff in ataxia/001_Miscellaneous_Aff_Tracking_Methods.lua (what tracking
#                  uses), else the wiki's Venom (Skill) page
#   cure        -- live WHATCURES (kb/afflictions/afflictions.json)
#   weapon      -- false where the wiki says it 'cannot be used to envenom a weapon' (bite only)
#   wiki        -- the wiki's own text (kb/raw/wiki/Venom.wiki)
# NO VENOM GIVES IMPATIENCE. Sumac and camus only do damage.

venoms:
  aconite:
    affliction: "stupidity"
    cure: "eat goldenseal / eat plumbum and focus mind"
    weapon: true
    source: "venom_to_aff"
    wiki: "Cause sheer stupidity in your opponent. Afflict your victim with sheer stupidity."

  camus:
    affliction: "none (damage, stronger than sumac)"
    cure: "n/a"
    weapon: false
    source: "wiki"
    wiki: "A more powerful version of Sumac. A more powerful version of Sumac poison. This venom can not be used to envenom a weapon."

  colocasia:
    affliction: "blindness + deafness"
    cure: "apply epidermal to head"
    weapon: true
    source: "wiki"
    wiki: "Gives blindness and deafness. Cause both blindness and deafness in your victim."

  curare:
    affliction: "paralysis"
    cure: "eat bloodroot / eat magnesium"
    weapon: true
    source: "venom_to_aff"
    wiki: "A venom of muscular paralysis. Cause your victim's body to freeze with paralysis."

  darkshade:
    affliction: "darkshade"
    cure: "eat ginseng / eat ferrum"
    weapon: true
    source: "venom_to_aff"
    wiki: "Makes the victim allergic to sunlight. Give your target an allergy to sunlight."

  delphinium:
    affliction: "sleeping"
    cure: "wake (or the insomnia / kola defences first)"
    weapon: true
    source: "venom_to_aff"
    wiki: "Put your victim to sleep. Put your victim to sleep."

  digitalis:
    affliction: "shyness"
    cure: "eat goldenseal / eat plumbum and focus mind"
    weapon: true
    source: "venom_to_aff"
    wiki: "Causes unbearable shyness. Cause unbearable shyness in your victim."

  epseth:
    affliction: "crippled leg (level 1 break)"
    cure: "apply mending to legs"
    weapon: true
    source: "venom_to_aff"
    wiki: "Cause the legs of your victim to become useless. Cause the legs of your victim to become useless."

  epteth:
    affliction: "crippled arm (level 1 break)"
    cure: "apply mending to arms"
    weapon: true
    source: "venom_to_aff"
    wiki: "Shrivel up the arms of your unlucky victim. Cause your victim's arms to shrivel."

  euphorbia:
    affliction: "nausea"
    cure: "eat ginseng / eat ferrum"
    weapon: true
    source: "venom_to_aff"
    wiki: "Induces spasmodic vomiting. Induces spasmodic vomiting."

  eurypteria:
    affliction: "recklessness"
    cure: "eat lobelia / eat argentum and focus mind"
    weapon: true
    source: "venom_to_aff"
    wiki: "Gives the victim delusions of invulnerability. Afflict your victim with recklessness."

  gecko:
    affliction: "slickness"
    cure: "smoke valerian / smoke realgar and eat bloodroot / eat magnesium"
    weapon: true
    source: "venom_to_aff"
    wiki: "Causes the recipient to become foully oily. Cause your victim to secrete foul oils from his skin."

  kalmia:
    affliction: "asthma"
    cure: "eat kelp / eat aurum"
    weapon: true
    source: "venom_to_aff"
    wiki: "Inhibits the respiratory system. Afflict your victim with severe asthma."

  larkspur:
    affliction: "dizziness"
    cure: "eat goldenseal / eat plumbum and focus mind"
    weapon: true
    source: "venom_to_aff"
    wiki: "Causes great dizziness. Cause great dizziness in your target."

  loki:
    affliction: "a random venom's affliction"
    cure: "n/a"
    weapon: true
    source: "wiki"
    wiki: "An unpredictable toxin. This unpredictable toxin will afflict your victim with a random venom."

  monkshood:
    affliction: "disloyalty"
    cure: "smoke valerian / smoke realgar"
    weapon: true
    source: "venom_to_aff"
    wiki: "Disfigure your victim, causing disloyalty in those around. Causes your victim to become disfigured making their loyal servants turn on them."

  nechamandra:
    affliction: "shivering"
    cure: "apply caloric"
    weapon: true
    source: "venom_to_aff"
    wiki: "A venom that chills the veins. A venom that chills the veins."

  notechis:
    affliction: "haemophilia"
    cure: "eat ginseng / eat ferrum"
    weapon: false
    source: "venom_to_aff"
    wiki: "Induce haemophilia in a target. Induce haemophilia in your target. This venom can not be used to envenom a weapon."

  oculus:
    affliction: "none: removes the target's blindness"
    cure: "n/a"
    weapon: true
    source: "wiki"
    wiki: "Forces the recipient's eyelids open. Forces your victim's eyelids open clearing his eyes of blindness."

  oleander:
    affliction: "blindness"
    cure: "apply epidermal to head"
    weapon: true
    source: "wiki"
    wiki: "Blindness. Cause blindness in your target."

  prefarar:
    affliction: "sensitivity"
    cure: "eat kelp / eat aurum"
    weapon: true
    source: "venom_to_aff"
    wiki: "Increase the recipient's sensitivity. Increase your victim's sensitivity to pain."

  scytherus:
    affliction: "scytherus"
    cure: "eat ginseng / eat ferrum"
    weapon: true
    source: "venom_to_aff"
    wiki: "A venom that thins the blood. A nasty venom that will thin the victim's blood allowing your toxins to be more effective."

  selarnia:
    affliction: "selarnia"
    cure: "apply mending to body"
    weapon: true
    source: "wiki"
    wiki: "Forcing your victim back into mortal form. This venom will force the spirit animals out of those pesky forestals."

  slike:
    affliction: "anorexia"
    cure: "apply epidermal to body and focus mind"
    weapon: true
    source: "venom_to_aff"
    wiki: "Give the curse of anorexia to your victim. Causes your victim to fall prey to anorexia."

  sumac:
    affliction: "none (damage)"
    cure: "n/a"
    weapon: false
    source: "wiki"
    wiki: "Minor damage. This venom will cause minor damage to adventurers and denizens. This venom cannot be used to envenom a weapon."

  vardrax:
    affliction: "addiction"
    cure: "eat ginseng / eat ferrum"
    weapon: true
    source: "venom_to_aff"
    wiki: "Grants an insatiable addiction. This potent venom will instill an addiction in your victim that will not be sated."

  vernalius:
    affliction: "weariness"
    cure: "eat kelp / eat aurum"
    weapon: true
    source: "venom_to_aff"
    wiki: "A venom that weakens the muscles. A venom that weakens the muscles."

  voyria:
    affliction: "voyria"
    cure: "sip immunity"
    weapon: true
    source: "venom_to_aff"
    wiki: "The deadliest venom known to mankind. This deadly venom will induce a quick death for its victim."

  xentio:
    affliction: "clumsiness"
    cure: "eat kelp / eat aurum"
    weapon: true
    source: "venom_to_aff"
    wiki: "Loss of coordination. Cause a loss of coordination in your target."

# ============================================================================
# VENOM RELATIONSHIPS
# ============================================================================

cure_competition:
  bloodroot_competition:
    venoms: [curare, gecko]
    afflictions: [paralysis, slickness]
    problem: "When asthma blocks smoking, bloodroot must cure both"
    defense_priority: "Cure paralysis first - blocks all actions including Tree"

  kelp_competition:
    venoms: [kalmia, vernalius]
    afflictions: [asthma, weariness]
    problem: "Both enable Serpent Impulse mechanic"
    defense_priority: "Cure asthma first - breaks Impulse AND restores smoking"

# ============================================================================
# EKANELIA TRANSFORMATIONS (Serpent BITE mechanic)
# ============================================================================

ekanelia:
  description: "Serpent BITE venom transformation that adds bonus afflictions"
  requirement: "Only works with BITE, not DOUBLESTAB"

  transformations:
    kalmia:
      conditionals: [clumsiness, weariness]
      normal_effect: asthma
      bonus_effect: slickness
      note: "Single BITE can give asthma + slickness"

    monkshood:
      conditionals: [asthma, masochism, weariness]
      normal_effect: disloyalty
      bonus_effect: impatience
      note: "Critical - can deliver impatience without Impulse"

    curare:
      conditionals: [hypersomnia, masochism]
      normal_effect: paralysis
      bonus_effect: hypochondria

    loki:
      conditionals: [confusion, recklessness]
      normal_effect: random
      bonus_effect: [nausea, paralysis]

    scytherus:
      conditionals: [addiction, nausea]
      normal_effect: scytherus
      bonus_effect: camus_damage

  defense_priority: |
    1. Cure masochism early - blocks 2 Ekanelia transformations
    2. Don't let clumsiness + weariness stack together
    3. Track conditional combos to predict incoming afflictions
